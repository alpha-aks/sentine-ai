name: SentinelAI Monorepo CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Restore pnpm Cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || npm install

      - name: Prettier Code Formatting Check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

      - name: ESLint Code Quality Scan
        run: pnpm lint || npm run lint

      - name: TypeScript Type Check Across Workspaces
        run: pnpm type-check || npm run type-check

      - name: Turbo Build Monorepo
        run: pnpm build || npm run build
